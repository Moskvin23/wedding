<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 691" preserveAspectRatio="xMidYMid slice" fill="none">

  <!-- LEFT LARGE FLOWER — center around (90, 380), big organic petals -->
  <g transform="translate(90, 380)" opacity="0.78">
    <!-- Petal 1 — pointing up-left -->
    <path d="M0 0 C-40 -30 -80 -100 -55 -200 C-35 -260 35 -260 55 -200 C80 -100 40 -30 0 0Z"
          transform="rotate(-36)" fill="#c03070"/>
    <!-- Petal 2 -->
    <path d="M0 0 C-40 -30 -80 -100 -55 -200 C-35 -260 35 -260 55 -200 C80 -100 40 -30 0 0Z"
          transform="rotate(36)" fill="#c83478"/>
    <!-- Petal 3 — pointing right -->
    <path d="M0 0 C-40 -30 -80 -100 -55 -200 C-35 -260 35 -260 55 -200 C80 -100 40 -30 0 0Z"
          transform="rotate(108)" fill="#c03070"/>
    <!-- Petal 4 -->
    <path d="M0 0 C-40 -30 -80 -100 -55 -200 C-35 -260 35 -260 55 -200 C80 -100 40 -30 0 0Z"
          transform="rotate(180)" fill="#c83478"/>
    <!-- Petal 5 -->
    <path d="M0 0 C-40 -30 -80 -100 -55 -200 C-35 -260 35 -260 55 -200 C80 -100 40 -30 0 0Z"
          transform="rotate(252)" fill="#c03070"/>
    <!-- Center vein lines on petals -->
    <line x1="0" y1="-10" x2="0" y2="-190" stroke="#a02060" stroke-width="1.5" opacity="0.4" transform="rotate(-36)"/>
    <line x1="0" y1="-10" x2="0" y2="-190" stroke="#a02060" stroke-width="1.5" opacity="0.4" transform="rotate(36)"/>
    <line x1="0" y1="-10" x2="0" y2="-190" stroke="#a02060" stroke-width="1.5" opacity="0.4" transform="rotate(108)"/>
    <line x1="0" y1="-10" x2="0" y2="-190" stroke="#a02060" stroke-width="1.5" opacity="0.4" transform="rotate(180)"/>
    <line x1="0" y1="-10" x2="0" y2="-190" stroke="#a02060" stroke-width="1.5" opacity="0.4" transform="rotate(252)"/>
    <!-- Stamens ring -->
    <g stroke="#d83878" stroke-width="2" opacity="0.9">
      <line x1="0" y1="-18" x2="0" y2="-64"/>
      <line x1="0" y1="-18" x2="46" y2="-39"/>
      <line x1="0" y1="-18" x2="56" y2="20"/>
      <line x1="0" y1="-18" x2="22" y2="56"/>
      <line x1="0" y1="-18" x2="-22" y2="56"/>
      <line x1="0" y1="-18" x2="-56" y2="20"/>
      <line x1="0" y1="-18" x2="-56" y2="-39"/>
      <line x1="0" y1="-18" x2="-24" y2="-64"/>
      <circle cx="0" cy="-64" r="4" fill="#d83878"/>
      <circle cx="46" cy="-39" r="4" fill="#d83878"/>
      <circle cx="56" cy="20" r="4" fill="#d83878"/>
      <circle cx="22" cy="56" r="4" fill="#d83878"/>
      <circle cx="-22" cy="56" r="4" fill="#d83878"/>
      <circle cx="-56" cy="20" r="4" fill="#d83878"/>
      <circle cx="-56" cy="-39" r="4" fill="#d83878"/>
      <circle cx="-24" cy="-64" r="4" fill="#d83878"/>
    </g>
    <!-- Center -->
    <circle cx="0" cy="-18" r="22" fill="#be2868"/>
    <!-- Stem going down -->
    <path d="M0 16 C8 60 14 130 10 220" stroke="#ae2460" stroke-width="4" fill="none" opacity="0.7"/>
    <!-- Leaf left -->
    <path d="M6 100 C-28 72 -76 78 -80 110 C-76 140 -28 135 6 120Z" fill="#ae2460" opacity="0.6"/>
    <!-- Leaf right -->
    <path d="M8 155 C38 130 84 136 88 168 C84 198 38 192 8 178Z" fill="#ae2460" opacity="0.6"/>
  </g>

  <!-- RIGHT / MAIN FLOWER — center around (960, 300), slightly larger, more to the right -->
  <g transform="translate(960, 300) rotate(22)" opacity="0.74">
    <!-- Petal 1 -->
    <path d="M0 0 C-46 -35 -90 -115 -62 -230 C-40 -298 40 -298 62 -230 C90 -115 46 -35 0 0Z"
          transform="rotate(0)" fill="#be2c6a"/>
    <!-- Petal 2 -->
    <path d="M0 0 C-46 -35 -90 -115 -62 -230 C-40 -298 40 -298 62 -230 C90 -115 46 -35 0 0Z"
          transform="rotate(72)" fill="#c83070"/>
    <!-- Petal 3 -->
    <path d="M0 0 C-46 -35 -90 -115 -62 -230 C-40 -298 40 -298 62 -230 C90 -115 46 -35 0 0Z"
          transform="rotate(144)" fill="#be2c6a"/>
    <!-- Petal 4 -->
    <path d="M0 0 C-46 -35 -90 -115 -62 -230 C-40 -298 40 -298 62 -230 C90 -115 46 -35 0 0Z"
          transform="rotate(216)" fill="#c83070"/>
    <!-- Petal 5 -->
    <path d="M0 0 C-46 -35 -90 -115 -62 -230 C-40 -298 40 -298 62 -230 C90 -115 46 -35 0 0Z"
          transform="rotate(288)" fill="#be2c6a"/>
    <!-- Petal vein lines -->
    <line x1="0" y1="-14" x2="0" y2="-222" stroke="#9e1c58" stroke-width="1.8" opacity="0.38" transform="rotate(0)"/>
    <line x1="0" y1="-14" x2="0" y2="-222" stroke="#9e1c58" stroke-width="1.8" opacity="0.38" transform="rotate(72)"/>
    <line x1="0" y1="-14" x2="0" y2="-222" stroke="#9e1c58" stroke-width="1.8" opacity="0.38" transform="rotate(144)"/>
    <line x1="0" y1="-14" x2="0" y2="-222" stroke="#9e1c58" stroke-width="1.8" opacity="0.38" transform="rotate(216)"/>
    <line x1="0" y1="-14" x2="0" y2="-222" stroke="#9e1c58" stroke-width="1.8" opacity="0.38" transform="rotate(288)"/>
    <!-- Stamens -->
    <g stroke="#d03270" stroke-width="2.2" opacity="0.88">
      <line x1="0" y1="-22" x2="0" y2="-75"/>
      <line x1="0" y1="-22" x2="54" y2="-47"/>
      <line x1="0" y1="-22" x2="66" y2="24"/>
      <line x1="0" y1="-22" x2="26" y2="66"/>
      <line x1="0" y1="-22" x2="-26" y2="66"/>
      <line x1="0" y1="-22" x2="-66" y2="24"/>
      <line x1="0" y1="-22" x2="-66" y2="-47"/>
      <line x1="0" y1="-22" x2="-28" y2="-75"/>
      <circle cx="0" cy="-75" r="4.5" fill="#d03270"/>
      <circle cx="54" cy="-47" r="4.5" fill="#d03270"/>
      <circle cx="66" cy="24" r="4.5" fill="#d03270"/>
      <circle cx="26" cy="66" r="4.5" fill="#d03270"/>
      <circle cx="-26" cy="66" r="4.5" fill="#d03270"/>
      <circle cx="-66" cy="24" r="4.5" fill="#d03270"/>
      <circle cx="-66" cy="-47" r="4.5" fill="#d03270"/>
      <circle cx="-28" cy="-75" r="4.5" fill="#d03270"/>
    </g>
    <!-- Center -->
    <circle cx="0" cy="-22" r="26" fill="#b82060"/>
    <!-- Stem with leaves going down-right -->
    <path d="M16 28 C38 80 62 155 80 240" stroke="#a81c58" stroke-width="4" fill="none" opacity="0.65"/>
    <path d="M48 120 C75 96 118 104 122 136 C118 166 75 160 48 148Z" fill="#a81c58" opacity="0.55"/>
    <path d="M68 190 C96 165 140 172 144 204 C140 234 96 228 68 216Z" fill="#a81c58" opacity="0.55"/>
  </g>

  <!-- SMALL BUD top-right -->
  <g transform="translate(1220, 110) rotate(40)" opacity="0.58">
    <path d="M0 0 C-18 -14 -34 -46 -22 -90 C-14 -116 14 -116 22 -90 C34 -46 18 -14 0 0Z"
          transform="rotate(0)" fill="#c03070"/>
    <path d="M0 0 C-18 -14 -34 -46 -22 -90 C-14 -116 14 -116 22 -90 C34 -46 18 -14 0 0Z"
          transform="rotate(72)" fill="#c83478"/>
    <path d="M0 0 C-18 -14 -34 -46 -22 -90 C-14 -116 14 -116 22 -90 C34 -46 18 -14 0 0Z"
          transform="rotate(144)" fill="#c03070"/>
    <path d="M0 0 C-18 -14 -34 -46 -22 -90 C-14 -116 14 -116 22 -90 C34 -46 18 -14 0 0Z"
          transform="rotate(216)" fill="#c83478"/>
    <path d="M0 0 C-18 -14 -34 -46 -22 -90 C-14 -116 14 -116 22 -90 C34 -46 18 -14 0 0Z"
          transform="rotate(288)" fill="#c03070"/>
    <circle cx="0" cy="-10" r="13" fill="#b82060"/>
    <path d="M0 10 C4 36 8 70 5 110" stroke="#a81c58" stroke-width="2.5" fill="none" opacity="0.65"/>
    <path d="M3 70 C20 55 46 60 48 80 C46 98 20 94 3 86Z" fill="#a81c58" opacity="0.55"/>
  </g>

</svg>
